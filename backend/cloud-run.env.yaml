# Environment variables of the Cloud Run service jalaspace-backend (see the README's
# Deployment section). Every deploy sets exactly these: a variable removed here is
# removed from the service. Values must be strings, so quote numbers and booleans.
#
# Never put secrets here: this file is public. Secrets live in Secret Manager and are
# listed in SECRETS in .github/workflows/deploy.yml and the dev script.
SEED_DEMO_DATA: 'true'
TRUST_PROXY: '1'
CORS_ORIGINS: 'https://jalaspace-demo.jussialanen.com,https://jalaspace.vercel.app,https://jalaspace-*-juzapalagmailcoms-projects.vercel.app,http://localhost:5173'
