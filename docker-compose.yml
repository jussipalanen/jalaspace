services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    volumes:
      # Mount the source so edits reload live in the container.
      - ./frontend:/app
      # Anonymous volume keeps the container's node_modules separate from the host.
      - /app/node_modules
    environment:
      NODE_ENV: development

  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    volumes:
      # Mount the source so `node --watch` restarts the API on edits.
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
