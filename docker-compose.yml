services:
  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    volumes:
      # Mount the source so edits reload live in the container.
      - ./frontend:/app
      # Anonymous volume keeps the container's node_modules separate from the host.
      - /app/node_modules
    environment:
      NODE_ENV: development
      # Read and save the data through the API container, so the whole stack runs together.
      # Remove it (or set localStorage) to keep the data in the browser instead.
      VITE_DATA_PROVIDER: api
      # The API; AI suggestions also need GEMINI_API_KEY in backend/.env.
      VITE_API_URL: http://localhost:3000

  backend:
    build:
      context: ./backend
    ports:
      - '3000:3000'
    volumes:
      # Mount the source so `node --watch` restarts the API on edits.
      - ./backend:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      # Start with the demo data, so it is back after every restart.
      SEED_DEMO_DATA: 'true'
      # Let the frontend container's dev server call the API from the browser.
      CORS_ORIGINS: http://localhost:5173
