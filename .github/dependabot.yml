version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Runtime dependency updates are releasable fixes; dev-tool updates are chores.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Minor and patch updates are grouped to reduce PR noise.
      # Major updates still arrive as separate PRs so they can be reviewed individually.
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/node must match the Node.js major the API runs on (backend/.nvmrc,
      # Render NODE_VERSION). Upgrade them together when moving to a new LTS.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
