name: Release

# After each merge to main, release-please opens or updates a release PR with the
# next version, the CHANGELOG entry and the version bump. Merging that PR (a human
# decision) creates the vX.Y.Z tag and the GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write # release-please labels its release PRs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A token from a GitHub App or fine-grained PAT lets CI run on the release PR;
          # PRs opened with the default GITHUB_TOKEN do not trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        if: ${{ steps.release.outputs.release_created }}
        run: echo "Released ${{ steps.release.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
