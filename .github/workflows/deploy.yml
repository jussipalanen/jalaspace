# Deploys the API to Google Cloud Run when a push to main changes backend/, after
# the CI checks pass. Signs in with Workload Identity Federation, so no Google key
# is stored in GitHub. Needs the repository variables GCP_PROJECT_ID,
# GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (see the README's
# Deployment section); without them the workflow is skipped.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: jalaspace-backend
  REGION: europe-north1

jobs:
  ci:
    name: CI
    if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # Builds the production stage of backend/Dockerfile with Cloud Build and
      # deploys a new revision. The service's other settings (instances, CPU,
      # memory, environment variables, secrets) stay as they were set by hand.
      - name: Deploy
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: >
          gcloud run deploy "$SERVICE"
          --source backend
          --region "$REGION"
          --project "$PROJECT_ID"
          --quiet

      - name: Check the health endpoint
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')
          curl --silent --show-error --fail --retry 5 --retry-all-errors "$url/api/health"
